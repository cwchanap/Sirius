name: Godot Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.2
  EXPORT_NAME: Sirius
  DOTNET_VERSION: 8.0.x

jobs:
  unit-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    name: Run GdUnit4 Tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download and install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip
          ls -la
          mkdir -p ~/godot
          find . -name "Godot*" -type f -executable
          chmod +x Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux.x86_64
          mv Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux.x86_64 ~/godot/godot
          mv Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/GodotSharp ~/godot/

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> $GITHUB_PATH
      
      - name: Set GODOT_BIN
        run: |
          cat <<'EOF' > "$HOME/godot/godot-headless"
          #!/usr/bin/env bash
          # TEMP DEBUG: record profiler env seen by the Godot process
          env | grep -E "^(COR_|CORECLR_)" > "$HOME/godot-cor-env.txt" || echo "NO COR_ VARS IN GODOT ENV" > "$HOME/godot-cor-env.txt"
          exec "$HOME/godot/godot" --headless "$@"
          EOF
          chmod +x "$HOME/godot/godot-headless"
          echo "GODOT_BIN=$HOME/godot/godot-headless" >> $GITHUB_ENV

      - name: Verify Godot installation
        run: |
          godot --version

      - name: Restore .NET dependencies
        run: dotnet restore Sirius.sln

      - name: Build project
        run: dotnet build Sirius.sln --configuration Release --no-restore

      - name: Import Godot assets
        run: |
          # Run Godot in headless mode to import assets and ensure .godot folder exists
          timeout 30 godot --headless --editor --quit || true
          sleep 2

      - name: Install GdUnit4 addon
        run: |
          # Download and install GdUnit4 addon
          mkdir -p addons
          cd addons
          wget -q https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v5.0.0.zip -O gdUnit4.zip
          unzip -q gdUnit4.zip
          rm gdUnit4.zip
          rm -rf gdUnit4
          mv gdUnit4-5.0.0/addons/gdUnit4 ./
          rm -rf gdUnit4-5.0.0
          cd ..
          # Re-import with GdUnit4 addon
          timeout 30 godot --headless --editor --quit || true
          sleep 2

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Run GdUnit4 tests
        run: |
          # Run tests using GdUnit4's command line runner
          # Use the .NET test adapter which integrates with GdUnit4
          # dotnet-coverage profiler env propagates into the Godot child process
          # (coverlet --collect only instruments testhost, which runs no game code)
          xvfb-run -a dotnet-coverage collect --output-format cobertura -o coverage.cobertura.xml -- \
            dotnet test Sirius.csproj --configuration Release --no-build --verbosity normal -m:1 --logger "console;verbosity=detailed" --settings test.runsettings
        continue-on-error: false

      - name: Run .NET tests (alternative)
        if: failure()
        run: |
          # Fallback: re-run under xvfb-run to reproduce display-related failures
          xvfb-run -a dotnet test Sirius.csproj --configuration Release --no-build --verbosity normal -m:1 --logger "console;verbosity=detailed" --settings test.runsettings || true

      - name: Temp experiment - Node suite via GdUnit4 cmd tool under coverage
        run: |
          xvfb-run -a dotnet-coverage collect --output-format cobertura -o exp-charactertest.xml -- \
            godot --headless --path . -s res://addons/gdUnit4/src/core/runners/GdUnitTestCIRunner.tscn -a tests/data/CharacterTest.cs || true
          python3 -c "
          import xml.etree.ElementTree as t
          r = t.parse('exp-charactertest.xml').getroot()
          hits = sum(int(l.get('hits','0')) for l in r.iter('line'))
          char_lines = [(l.get('hits')) for c in r.iter('class') if 'Character' in (c.get('filename') or '') for l in c.iter('line')]
          print('TOTAL HITS:', hits, '| CharacterTest lines:', char_lines[:20])"

      - name: Collect env probe
        if: always()
        run: cp "$HOME/godot-cor-env.txt" ./godot-cor-env.txt 2>/dev/null || echo "probe file missing" > ./godot-cor-env.txt

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .godot/
            TestResults/
            coverage.cobertura.xml
            godot-cor-env.txt
            exp-charactertest.xml
          retention-days: 7

      - name: Test Report Summary
        if: always()
        run: |
          echo "## Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Godot Version: ${{ env.GODOT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- .NET Version: ${{ env.DOTNET_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests Location: tests/" >> $GITHUB_STEP_SUMMARY
