<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="screenScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050714" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#050714" stop-opacity=".20"/>
      <stop offset="1" stop-color="#050714" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18234A" stop-opacity=".94"/>
      <stop offset="1" stop-color="#0D1530" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="goldButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D784"/>
      <stop offset="1" stop-color="#DFAE43"/>
    </linearGradient>
    <linearGradient id="hpFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F16D83"/>
      <stop offset="1" stop-color="#D94A67"/>
    </linearGradient>
    <linearGradient id="mpFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62DCFF"/>
      <stop offset="1" stop-color="#28A9D2"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#030611" flood-opacity=".7"/>
    </filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#62DCFF" flood-opacity=".75"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F5D784" flood-opacity=".55"/>
    </filter>
    <clipPath id="playerPortrait">
      <circle cx="106" cy="154" r="46"/>
    </clipPath>
    <clipPath id="enemyPortrait">
      <circle cx="1174" cy="154" r="46"/>
    </clipPath>
    <style>
      .display { font-family: "Cinzel", Georgia, serif; fill: #F7F5FF; font-weight: 700; letter-spacing: 2px; }
      .title { font-family: "Cinzel", Georgia, serif; fill: #F5D784; font-weight: 700; letter-spacing: 1px; }
      .text { font-family: "Noto Sans", Arial, sans-serif; fill: #F7F5FF; }
      .secondary { font-family: "Noto Sans", Arial, sans-serif; fill: #C7CEE8; }
      .muted { font-family: "Noto Sans", Arial, sans-serif; fill: #8F9AB8; }
      .tiny { font-family: "Noto Sans", Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .6px; }
    </style>
  </defs>

  <image href="../../../../assets/sprites/ui/ui_battle_background.png" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="720" fill="url(#screenScrim)"/>

  <!-- restrained constellation ornament -->
  <g fill="none" stroke="#62DCFF" stroke-opacity=".24" stroke-width="1.2">
    <path d="M406 80 L462 48 L520 82 L578 52 L642 86"/>
    <path d="M880 64 L916 38 L954 72 L1004 44"/>
  </g>
  <g fill="#F7F5FF" opacity=".72">
    <path d="M462 42 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M578 46 l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M916 32 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>

  <text class="display" x="640" y="42" text-anchor="middle" font-size="26">PREPARE FOR BATTLE</text>
  <text class="secondary" x="640" y="66" text-anchor="middle" font-size="13">Choose one optional consumable, then confirm the encounter.</text>

  <!-- Player plate -->
  <g filter="url(#panelShadow)">
    <rect x="28" y="82" width="314" height="238" rx="16" fill="url(#panelFill)" stroke="#62DCFF" stroke-opacity=".56" stroke-width="1.5"/>
    <path d="M44 102 H180" stroke="#62DCFF" stroke-opacity=".38"/>
    <circle cx="106" cy="154" r="52" fill="#0D1530" stroke="#62DCFF" stroke-width="2"/>
    <image href="../../../../assets/sprites/characters/player_hero/frames/frame1.png" x="58" y="106" width="96" height="96" image-rendering="pixelated" clip-path="url(#playerPortrait)"/>
    <text class="title" x="174" y="130" font-size="19">HERO</text>
    <text class="secondary" x="174" y="153" font-size="13">Level 8 · Vanguard</text>
    <rect x="174" y="171" width="140" height="10" rx="5" fill="#050714"/>
    <rect x="174" y="171" width="118" height="10" rx="5" fill="url(#hpFill)"/>
    <text class="text" x="174" y="202" font-size="12">HP 118 / 150</text>
    <rect x="174" y="214" width="140" height="8" rx="4" fill="#050714"/>
    <rect x="174" y="214" width="96" height="8" rx="4" fill="url(#mpFill)"/>
    <text class="text" x="174" y="245" font-size="12">MP 34 / 50</text>
    <rect x="52" y="270" width="266" height="32" rx="8" fill="#27366C" fill-opacity=".72" stroke="#62DCFF" stroke-opacity=".28"/>
    <text class="secondary" x="66" y="291" font-size="12">Active Skill</text>
    <text class="text" x="150" y="291" font-size="12" font-weight="700">Power Strike · every 3 turns</text>
  </g>

  <!-- Enemy plate -->
  <g filter="url(#panelShadow)">
    <rect x="938" y="82" width="314" height="238" rx="16" fill="url(#panelFill)" stroke="#D96CC2" stroke-opacity=".62" stroke-width="1.5"/>
    <path d="M1100 102 H1236" stroke="#D96CC2" stroke-opacity=".42"/>
    <circle cx="1174" cy="154" r="52" fill="#0D1530" stroke="#D96CC2" stroke-width="2"/>
    <image href="../../../../assets/sprites/enemies/goblin/frames/frame1.png" x="1126" y="106" width="96" height="96" image-rendering="pixelated" clip-path="url(#enemyPortrait)"/>
    <text class="title" x="966" y="130" font-size="19">GOBLIN RAIDER</text>
    <text class="secondary" x="966" y="153" font-size="13">Level 7 · Beast</text>
    <rect x="966" y="171" width="140" height="10" rx="5" fill="#050714"/>
    <rect x="966" y="171" width="92" height="10" rx="5" fill="url(#hpFill)"/>
    <text class="text" x="966" y="202" font-size="12">HP 52 / 80</text>
    <text class="secondary" x="966" y="232" font-size="12">First-turn forecast</text>
    <text class="text" x="1082" y="232" font-size="12" font-weight="700">Enemy</text>
    <rect x="962" y="270" width="266" height="32" rx="8" fill="#27366C" fill-opacity=".72" stroke="#D96CC2" stroke-opacity=".32"/>
    <text class="secondary" x="976" y="291" font-size="12">Known trait</text>
    <text class="text" x="1060" y="291" font-size="12" font-weight="700">May inflict Weaken</text>
  </g>

  <!-- Preparation tray -->
  <g filter="url(#panelShadow)">
    <rect x="24" y="350" width="1232" height="346" rx="18" fill="url(#panelFill)" stroke="#F5D784" stroke-opacity=".52" stroke-width="1.5"/>
    <path d="M44 378 H184 M1096 378 H1236" stroke="#F5D784" stroke-opacity=".38"/>
    <path d="M104 350 A70 70 0 0 0 44 410" fill="none" stroke="#62DCFF" stroke-opacity=".18"/>
    <path d="M1176 350 A70 70 0 0 1 1236 410" fill="none" stroke="#F5D784" stroke-opacity=".2"/>
    <text class="title" x="52" y="398" font-size="20">PREPARATION</text>
    <text class="secondary" x="248" y="398" font-size="12">Optional · one item maximum</text>
    <rect x="1034" y="374" width="190" height="30" rx="15" fill="#27366C" stroke="#62DCFF" stroke-opacity=".28"/>
    <text class="secondary" x="1129" y="394" font-size="12" text-anchor="middle">Power Strike equipped</text>

    <!-- selected -->
    <g filter="url(#goldGlow)">
      <rect x="52" y="424" width="205" height="158" rx="12" fill="#27366C" fill-opacity=".94" stroke="#F5D784" stroke-width="2.5"/>
    </g>
    <rect x="66" y="438" width="62" height="62" rx="8" fill="#0D1530" stroke="#F5D784" stroke-opacity=".5"/>
    <image href="../../../../assets/sprites/items/consumables/health_potion.png" x="70" y="442" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    <text class="text" x="140" y="456" font-size="13" font-weight="700">Health Potion</text>
    <text class="secondary" x="140" y="476" font-size="12">Owned 3</text>
    <text class="secondary" x="66" y="525" font-size="12">Restores 50 HP</text>
    <text class="secondary" x="66" y="545" font-size="12">Target · Hero</text>
    <rect x="66" y="554" width="86" height="18" rx="9" fill="#F5D784"/>
    <text class="tiny" x="109" y="567" text-anchor="middle" fill="#0D1530">✓ SELECTED</text>

    <!-- focused -->
    <g filter="url(#cyanGlow)">
      <rect x="273" y="424" width="205" height="158" rx="12" fill="#27366C" fill-opacity=".94" stroke="#62DCFF" stroke-width="3"/>
    </g>
    <rect x="287" y="438" width="62" height="62" rx="8" fill="#0D1530" stroke="#62DCFF" stroke-opacity=".5"/>
    <image href="../../../../assets/sprites/items/consumables/strength_tonic.png" x="291" y="442" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    <text class="text" x="361" y="456" font-size="13" font-weight="700">Strength Tonic</text>
    <text class="secondary" x="361" y="476" font-size="12">Owned 1</text>
    <text class="secondary" x="287" y="525" font-size="12">ATK +20% · 3 turns</text>
    <text class="secondary" x="287" y="545" font-size="12">Target · Hero</text>
    <rect x="287" y="554" width="60" height="18" rx="9" fill="#62DCFF"/>
    <text class="tiny" x="317" y="567" text-anchor="middle" fill="#0D1530">FOCUS</text>

    <!-- normal -->
    <rect x="494" y="424" width="205" height="158" rx="12" fill="#27366C" fill-opacity=".88" stroke="#8F9AB8" stroke-opacity=".58"/>
    <rect x="508" y="438" width="62" height="62" rx="8" fill="#0D1530" stroke="#8F9AB8" stroke-opacity=".42"/>
    <image href="../../../../assets/sprites/items/consumables/smoke_bomb.png" x="512" y="442" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
    <text class="text" x="582" y="456" font-size="13" font-weight="700">Smoke Bomb</text>
    <text class="secondary" x="582" y="476" font-size="12">Owned 2</text>
    <text class="secondary" x="508" y="525" font-size="12">Applies Blind</text>
    <text class="secondary" x="508" y="545" font-size="12">Target · Enemy</text>
    <text class="muted" x="508" y="568" font-size="11">Normal state</text>

    <!-- disabled -->
    <g opacity=".45">
      <rect x="715" y="424" width="205" height="158" rx="12" fill="#27366C" stroke="#8F9AB8"/>
      <rect x="729" y="438" width="62" height="62" rx="8" fill="#0D1530" stroke="#8F9AB8"/>
      <image href="../../../../assets/sprites/items/consumables/warding_charm.png" x="733" y="442" width="54" height="54" preserveAspectRatio="xMidYMid meet"/>
      <text class="text" x="803" y="456" font-size="13" font-weight="700">Warding Charm</text>
      <text class="secondary" x="803" y="476" font-size="12">Owned 0</text>
      <text class="secondary" x="729" y="525" font-size="12">Raises resistance</text>
      <text class="secondary" x="729" y="545" font-size="12">Unavailable · none owned</text>
    </g>
    <circle cx="900" cy="444" r="9" fill="#0D1530" stroke="#8F9AB8"/>
    <path d="M896 444 h8 M900 440 v8" stroke="#8F9AB8" stroke-width="1.5"/>

    <!-- action -->
    <rect x="966" y="438" width="258" height="54" rx="9" fill="#27366C" stroke="#8F9AB8" stroke-opacity=".48"/>
    <text class="secondary" x="1095" y="460" text-anchor="middle" font-size="11">FIRST TURN AFTER ITEM</text>
    <text class="text" x="1095" y="481" text-anchor="middle" font-size="14" font-weight="700">Recalculated on confirm</text>
    <g filter="url(#goldGlow)">
      <rect x="966" y="510" width="258" height="72" rx="12" fill="url(#goldButton)" stroke="#FFF3C2" stroke-opacity=".78" stroke-width="1.5"/>
    </g>
    <path d="M1000 546 h18 M1009 537 l9 9-9 9" fill="none" stroke="#0D1530" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1032" y="553" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#0D1530">Begin Battle</text>

    <rect x="52" y="606" width="868" height="54" rx="9" fill="#0D1530" fill-opacity=".72" stroke="#F5D784" stroke-opacity=".26"/>
    <text class="title" x="70" y="629" font-size="12">SELECTED</text>
    <text class="text" x="174" y="629" font-size="12" font-weight="700">Health Potion</text>
    <text class="secondary" x="246" y="629" font-size="12">Restore 50 HP to Hero before turn order is calculated.</text>
    <text class="muted" x="70" y="649" font-size="11">The item is consumed only after Begin Battle succeeds; failures preserve rollback behavior.</text>

    <g class="secondary" font-size="12">
      <rect x="966" y="608" width="52" height="24" rx="6" fill="#27366C" stroke="#62DCFF" stroke-opacity=".36"/>
      <text x="992" y="625" text-anchor="middle">A</text>
      <text x="1028" y="625">Select</text>
      <rect x="1084" y="608" width="52" height="24" rx="6" fill="#27366C" stroke="#62DCFF" stroke-opacity=".36"/>
      <text x="1110" y="625" text-anchor="middle">X</text>
      <text x="1146" y="625">Clear</text>
      <rect x="966" y="640" width="52" height="24" rx="6" fill="#27366C" stroke="#62DCFF" stroke-opacity=".36"/>
      <text x="992" y="657" text-anchor="middle">B</text>
      <text x="1028" y="657">Escape</text>
    </g>
  </g>
</svg>
